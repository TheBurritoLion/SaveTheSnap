name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install media test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: Run synthetic tests (Linux with real ExifTool)
        if: runner.os == 'Linux'
        env:
          SAVETHESNAP_TEST_EXIFTOOL: /usr/bin/exiftool
        run: python -m unittest discover -s tests -v
      - name: Run synthetic tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
